{# 보완 자료 요청 (FR-22): 심사관·배정 교수 #}
<details class="mt-8 rounded-md border border-hairline p-5" {% if v.evaluation.recommendation == 'insufficient' and not v.open_materials %}open{% endif %}>
  <summary class="cursor-pointer list-none font-semibold">학생에게 보완 자료 요청{% if v.open_materials %} <span class="text-sm font-normal text-muted">· 제출 대기 {{ v.open_materials | length }}건</span>{% endif %}</summary>
  <form method="post" action="/{{ 'professor' if user.role == 'professor' else 'review' }}/evaluations/{{ v.evaluation.id }}/materials" class="mt-3 grid gap-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <fieldset class="flex flex-wrap gap-2">
      <legend class="mb-1 text-sm text-muted">필요한 자료 (분석이 제안한 자료가 먼저 나와요)</legend>
      {% for item in v.suggested_materials %}
      <label class="chip cursor-pointer has-[:checked]:border-ink has-[:checked]:bg-ink has-[:checked]:text-white"><input class="sr-only" type="checkbox" name="items" value="{{ item }}" {% if v.result and item in v.result.missing_materials %}checked{% endif %}>{{ item }}</label>
      {% endfor %}
    </fieldset>
    <label class="field"><span>학생에게 전할 메모 (선택)</span><textarea class="textarea" name="note" rows="2" maxlength="1000" placeholder="예: 9~12주차에 다룬 고유값 단원의 강의 자료"></textarea></label>
    <button class="btn-secondary w-fit">요청 보내기</button>
  </form>
</details>
