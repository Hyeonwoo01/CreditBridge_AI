# 로컬 인프라만: docker compose up -d db redis s3
# 앱까지 한 번에 (버킷·데모 계정 자동): docker compose --profile app up -d --build → http://localhost:8000
# DB를 처음부터 다시 만들기: docker compose --profile app down -v (볼륨 삭제) 후 다시 up
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: creditbridge
      POSTGRES_USER: creditbridge
      POSTGRES_PASSWORD: change-me
    # 볼륨이 비어 있을 때 한 번만 실행된다: 스키마(init.sql) → 초기 데이터(data.sql, 데모용)
    # 두 파일은 sh scripts/export_db_sql.sh로 다시 만든다 (스키마의 기준은 Alembic)
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditbridge -d creditbridge"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

  # S3 호환 파일 저장소 (개발용 SeaweedFS). MinIO는 공식 이미지 배포가 끊겨 바꿨다. 운영은 AWS S3
  # 개발용이라 인증 없이 열고 localhost에만 연다 (앱의 S3 키 값은 무엇이든 통과)
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-s3", "-dir=/data"]
    ports: ["127.0.0.1:9000:8333"]
    volumes: ["s3-data:/data"]

  web:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://creditbridge:change-me@db:5432/creditbridge
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://s3:8333
      # 데모 카탈로그·계정 (db/data.sql로 이미 들어 있으면 건너뜀). 운영에서는 false
      SEED_DEMO: ${SEED_DEMO:-true}
    # 내 컴퓨터에서만 접속하도록 localhost에만 연다
    ports: ["127.0.0.1:8000:8000"]
    restart: on-failure
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      s3: {condition: service_started}

  worker:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://creditbridge:change-me@db:5432/creditbridge
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://s3:8333
    command: ["uv", "run", "--no-group", "dev", "celery", "-A", "backend.workers.celery_app", "worker", "--loglevel=info"]
    depends_on: [db, redis, s3]
    restart: on-failure

  # 기한 알림을 매일 정해진 시각(REMINDER_HOUR_UTC)에 작업 큐에 넣는다. 반드시 하나만 띄운다
  beat:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://creditbridge:change-me@db:5432/creditbridge
      REDIS_URL: redis://redis:6379/0
    command: ["uv", "run", "--no-group", "dev", "celery", "-A", "backend.workers.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on: [redis]
    restart: on-failure

volumes:
  db-data:
  s3-data:
