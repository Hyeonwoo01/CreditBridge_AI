# 로컬 인프라만: docker compose up -d db redis minio
# 앱까지 한 번에 (마이그레이션·버킷·데모 계정 자동): docker compose --profile app up -d --build → http://localhost:8000
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: change-me-root
      MARIADB_DATABASE: creditbridge
      MARIADB_USER: creditbridge
      MARIADB_PASSWORD: change-me
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["db-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: change-me
      MINIO_ROOT_PASSWORD: change-me-please
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]

  web:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://creditbridge:change-me@db:3306/creditbridge?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      # 데모 카탈로그·계정을 넣는다 (이미 있으면 건너뜀). 운영에서는 false
      SEED_DEMO: ${SEED_DEMO:-true}
    # 내 컴퓨터에서만 접속하도록 localhost에만 연다
    ports: ["127.0.0.1:8000:8000"]
    restart: on-failure
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

  worker:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://creditbridge:change-me@db:3306/creditbridge?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    command: ["uv", "run", "--no-group", "dev", "celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    depends_on: [db, redis, minio]
    restart: on-failure

volumes:
  db-data:
  minio-data:
