# 푸시·PR마다 CLAUDE.md "작업 완료 전 확인"과 같은 검사를 돌린다 (통합 테스트는 PostgreSQL 17 서비스 컨테이너)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: creditbridge
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: creditbridge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U creditbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://creditbridge:change-me@localhost:5432/creditbridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (Ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy backend
      - name: Translations
        run: uv run python -m scripts.i18n_check
      - name: Docs check (endpoints, ERD columns, screen button tables)
        run: uv run python -m scripts.docs_check
      - name: Tests (unit + integration)
        run: uv run pytest tests/unit tests/integration -q
