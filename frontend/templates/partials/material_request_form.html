{# 보완 자료 요청 (FR-22): 심사관·배정 교수 #}
<details id="materials" class="mt-8 scroll-mt-16 rounded-lg border border-hairline bg-white p-6" {% if v.evaluation.recommendation == 'insufficient' and not v.open_materials %}open{% endif %}>
  <summary class="cursor-pointer list-none font-semibold">{{ _("학생에게 보완 자료 요청") }}{% if v.open_materials %} <span class="text-sm font-normal text-muted">{{ _("· 제출 대기 {open_materials}건", open_materials=(v.open_materials | length)) }}</span>{% endif %}</summary>
  <form method="post" action="/{{ 'professor' if user.role == 'professor' else 'review' }}/evaluations/{{ v.evaluation.id }}/materials" class="mt-3 grid gap-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <fieldset class="flex flex-wrap gap-2">
      <legend class="mb-1 text-sm text-muted">{{ _("필요한 자료 (분석이 제안한 자료가 먼저 나와요)") }}</legend>
      {% for item in v.suggested_materials %}
      <label class="chip cursor-pointer"><input class="sr-only" type="checkbox" name="items" value="{{ item }}" {% if v.result and item in v.result.missing_materials %}checked{% endif %}>{{ item | ai_item(v.result) }}</label>
      {% endfor %}
    </fieldset>
    <label class="field"><span>{{ _("학생에게 전할 메모 (선택)") }}</span><textarea class="textarea" name="note" rows="2" maxlength="1000" placeholder="{{ _('예: 9~12주차에 다룬 고유값 단원의 강의 자료') }}"></textarea></label>
    <button class="btn-secondary w-fit">{{ _("요청 보내기") }}</button>
  </form>
</details>
